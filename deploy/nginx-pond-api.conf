# Nginx reverse proxy snippet for pond-api
# Place in /etc/nginx/sites-available/pond-api and symlink to sites-enabled/

server {
    listen 80;
    server_name your.domain.com;  # replace with actual domain or IP

    # Increase max upload size for large KMZ files
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Allow long-running analysis requests
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
